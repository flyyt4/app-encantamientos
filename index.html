<!doctype html>
<html lang="es">
  <head>

    <link rel="stylesheet" href="assets/css/desing.css" />
    <link rel="stylesheet" href="assets/css/index.css" />
    <title>App Encantamientos</title>
  </head>
  <body>
    <div class="app__border">
      <div class="app">

              alt="Un libro con estilo pixel art"

          <div class="app__header__version">
            <div class="app__header__version__selector">

              <label for="version__selector">Version:</label>

                <option value="23.3">23.3</option>
              </select>

        </header>
        <aside class="enchantments__list"></aside>
        <main class="app__item"></main>
        <aside class="enchantments__order"></aside>
      </div>
    </div>
